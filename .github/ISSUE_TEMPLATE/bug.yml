name: Bug
description: Comportamiento incorrecto.
labels: ["bug", "tipo:fix"]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Esperado vs. obtenido
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión
      description: Salida de `sqlviz --version` o commit.
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Navegador, SO, logs, capturas.
